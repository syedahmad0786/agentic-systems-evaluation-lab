[project]
name = "agentic-systems-evaluation-lab"
version = "1.0.0"
description = "Black-box agent evaluation lab with a CrewAI editorial teaching crew"
authors = [{ name = "Ahmad Bukhari" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.15.17,<1.16",
    "fastapi==0.116.1",
    "pydantic>=2.11.9,<2.13",
    "uvicorn==0.35.0",
]

[project.scripts]
agentic-systems-editorial-crew = "agentic_systems_evaluation_lab.main:run"
run_crew = "agentic_systems_evaluation_lab.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_systems_evaluation_lab"]

[tool.crewai]
type = "crew"

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
