[project]
name = "agentic-systems-editorial-crew"
version = "0.1.0"
description = "A CrewAI teaching crew that turns an evidence packet into a human-gated agentic-systems content pack"
authors = [{ name = "Ahmad Bukhari" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.15.17,<1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
